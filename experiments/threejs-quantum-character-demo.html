<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js 3D Procedural Cartoon Animation Demo | Procanimation Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #webgl-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(12px);
      max-width: 380px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 0.82rem;
      line-height: 1.45;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .controls-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #f1f5f9;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover, button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .telemetry-card {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #c084fc;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="hud-overlay">
    <span class="badge">Procanimation 3D WebGL Pipeline</span>
    <h1>Interactive 3D Cartoon Character</h1>
    <p>Real-time 3D skeletal mesh with dynamic shadows, quantum orbital particle cloud, and lighting presets. Zero-install browser native!</p>
    <div class="controls-grid">
      <button class="active" onclick="setPose('explain')">Explain</button>
      <button onclick="setPose('wave')">Wave</button>
      <button onclick="setPose('wonder')">Wonder</button>
      <button onclick="setLighting('quantum')">Quantum Violet</button>
      <button onclick="setLighting('tungsten')">Warm Brass</button>
      <button onclick="setLighting('cryo')">Cryo Blue</button>
    </div>
  </div>

  <div class="telemetry-card">
    <div>FPS: <span id="fps-val">60</span> | PBR Shadows: ON</div>
    <div>Quantum Orbital Points: 1,200</div>
    <div>Rig Joints: 14 Articulations</div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.2, 5.5);

    // 1. Lighting Setup
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x0f172a, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xa855f7, 1.8);
    dirLight.position.set(3, 6, 4);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 15;
    scene.add(dirLight);

    const rimLight = new THREE.PointLight(0x00f5ff, 2.5, 10);
    rimLight.position.set(-3, 3, -2);
    scene.add(rimLight);

    // 2. Stage Floor (Reflective Hexagonal Lab Platform)
    const floorGeo = new THREE.CylinderGeometry(6, 6, 0.2, 32);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.7 });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.position.y = -0.1;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Grid Ring
    const ringGeo = new THREE.RingGeometry(4.5, 4.6, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = -Math.PI / 2;
    ringMesh.position.y = 0.01;
    scene.add(ringMesh);

    // 3. Central Quantum Core (Floating Glowing Gyroscope)
    const coreGroup = new THREE.Group();
    coreGroup.position.set(0, 1.8, -1.0);
    scene.add(coreGroup);

    // Glowing Nucleus
    const nucleusGeo = new THREE.IcosahedronGeometry(0.35, 3);
    const nucleusMat = new THREE.MeshStandardMaterial({
      color: 0xfbbf24,
      emissive: 0xf59e0b,
      emissiveIntensity: 1.5,
      roughness: 0.2
    });
    const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
    coreGroup.add(nucleus);

    // Quantum Orbital Particle Cloud
    const particleCount = 1200;
    const particleGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = 0.8 + Math.random() * 1.4;
      posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      posArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      posArray[i * 3 + 2] = r * Math.cos(phi);
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particleMat = new THREE.PointsMaterial({
      size: 0.035,
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    coreGroup.add(particleSystem);

    // 4. Stylized 3D Cartoon Character (Leo / Explorer)
    const char = new THREE.Group();
    char.position.set(1.4, 0, 0.4);
    char.rotation.y = -0.4;
    scene.add(char);

    // Character Materials
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d, roughness: 0.6 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.5 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
    const shoesMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
    const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Torso
    const torsoGeo = new THREE.CylinderGeometry(0.24, 0.22, 0.7, 16);
    const torso = new THREE.Mesh(torsoGeo, shirtMat);
    torso.position.y = 1.05;
    torso.castShadow = true;
    char.add(torso);

    // Pelvis
    const pelvisGeo = new THREE.SphereGeometry(0.22, 16, 16);
    const pelvis = new THREE.Mesh(pelvisGeo, pantsMat);
    pelvis.position.y = 0.72;
    pelvis.castShadow = true;
    char.add(pelvis);

    // Legs (Left & Right)
    const leftLeg = new THREE.Group();
    leftLeg.position.set(-0.12, 0.68, 0);
    const legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.65, 12);
    const legMesh = new THREE.Mesh(legGeo, pantsMat);
    legMesh.position.y = -0.32;
    legMesh.castShadow = true;
    leftLeg.add(legMesh);
    const shoeGeo = new THREE.BoxGeometry(0.12, 0.1, 0.22);
    const leftShoe = new THREE.Mesh(shoeGeo, shoesMat);
    leftShoe.position.set(0, -0.65, 0.04);
    leftShoe.castShadow = true;
    leftLeg.add(leftShoe);
    char.add(leftLeg);

    const rightLeg = leftLeg.clone();
    rightLeg.position.x = 0.12;
    char.add(rightLeg);

    // Head
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.55, 0);
    const headGeo = new THREE.SphereGeometry(0.28, 24, 24);
    const headMesh = new THREE.Mesh(headGeo, skinMat);
    headMesh.castShadow = true;
    headGroup.add(headMesh);

    // Stylized Hair Crest
    const hairGeo = new THREE.SphereGeometry(0.30, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
    const hairMesh = new THREE.Mesh(hairGeo, hairMat);
    hairMesh.position.y = 0.05;
    hairMesh.castShadow = true;
    headGroup.add(hairMesh);

    // Eyes
    [-0.1, 0.1].forEach(ex => {
      const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), eyeWhiteMat);
      eyeWhite.position.set(ex, 0.04, 0.25);
      headGroup.add(eyeWhite);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12), eyeMat);
      pupil.position.set(ex, 0.04, 0.29);
      headGroup.add(pupil);
    });

    char.add(headGroup);

    // Right Articulated Arm (Shoulder -> UpperArm -> Forearm)
    const rightArm = new THREE.Group();
    rightArm.position.set(0.28, 1.32, 0);
    const upperArmGeo = new THREE.CylinderGeometry(0.06, 0.055, 0.32, 12);
    const upperArm = new THREE.Mesh(upperArmGeo, shirtMat);
    upperArm.position.y = -0.16;
    upperArm.castShadow = true;
    rightArm.add(upperArm);

    const forearm = new THREE.Group();
    forearm.position.set(0, -0.32, 0);
    const forearmGeo = new THREE.CylinderGeometry(0.055, 0.048, 0.32, 12);
    const forearmMesh = new THREE.Mesh(forearmGeo, skinMat);
    forearmMesh.position.y = -0.16;
    forearmMesh.castShadow = true;
    forearm.add(forearmMesh);

    const handGeo = new THREE.SphereGeometry(0.065, 12, 12);
    const handMesh = new THREE.Mesh(handGeo, skinMat);
    handMesh.position.y = -0.34;
    forearm.add(handMesh);
    rightArm.add(forearm);
    char.add(rightArm);

    // Left Arm (Resting)
    const leftArm = rightArm.clone();
    leftArm.position.x = -0.28;
    char.add(leftArm);

    // 5. Interactive Animation State
    let currentPose = 'explain';

    window.setPose = function(pose) {
      currentPose = pose;
      document.querySelectorAll('.controls-grid button').forEach(b => {
        if (b.textContent.toLowerCase() === pose) b.classList.add('active');
        else if (['explain', 'wave', 'wonder'].includes(b.textContent.toLowerCase())) b.classList.remove('active');
      });
    };

    window.setLighting = function(mode) {
      if (mode === 'quantum') {
        dirLight.color.setHex(0xa855f7);
        rimLight.color.setHex(0x00f5ff);
        scene.fog.color.setHex(0x070b14);
      } else if (mode === 'tungsten') {
        dirLight.color.setHex(0xf59e0b);
        rimLight.color.setHex(0xfef08a);
        scene.fog.color.setHex(0x180d04);
      } else if (mode === 'cryo') {
        dirLight.color.setHex(0x38bdf8);
        rimLight.color.setHex(0x60a5fa);
        scene.fog.color.setHex(0x031326);
      }
    };

    // Frame capture helper for deterministic rendering / Playwright
    window.renderFrame = function(t) {
      updateScene(t);
      renderer.render(scene, camera);
      return canvas.toDataURL('image/jpeg', 0.92);
    };

    function updateScene(t) {
      // 1. Quantum Orbital Spin
      particleSystem.rotation.y = t * 0.8;
      particleSystem.rotation.z = t * 0.4;
      nucleus.rotation.y = t * 1.5;
      nucleus.position.y = Math.sin(t * 3) * 0.08;

      // 2. Character Breathing
      torso.scale.y = 1.0 + Math.sin(t * 2.5) * 0.03;
      torso.scale.x = 1.0 + Math.sin(t * 2.5) * 0.02;
      headGroup.position.y = 1.55 + Math.sin(t * 2.5) * 0.015;

      // 3. Gestures
      if (currentPose === 'explain') {
        rightArm.rotation.x = -0.6 + Math.sin(t * 4) * 0.15;
        rightArm.rotation.z = 0.3;
        forearm.rotation.x = -1.2 + Math.cos(t * 4) * 0.2;
        headGroup.rotation.y = Math.sin(t * 2) * 0.12 - 0.2;
      } else if (currentPose === 'wave') {
        rightArm.rotation.x = 0;
        rightArm.rotation.z = 2.4 + Math.sin(t * 8) * 0.35;
        forearm.rotation.z = 0.5 + Math.cos(t * 8) * 0.3;
        headGroup.rotation.y = 0.2;
      } else if (currentPose === 'wonder') {
        rightArm.rotation.x = -1.4;
        rightArm.rotation.z = 0.4;
        forearm.rotation.x = -1.5;
        headGroup.rotation.x = -0.3;
        headGroup.rotation.y = Math.sin(t * 1.5) * 0.15;
      }

      // Camera gentle sway
      camera.position.x = Math.sin(t * 0.5) * 0.4;
      camera.lookAt(0, 1.4, 0);
    }

    // Render Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      updateScene(t);
      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
