<section id="projects" class="section projects-section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Interactive Experiments</span>
      <h2>Open Source Creative Coding</h2>
      <p>Explore our visual simulations, generative art algorithms, and mathematical models.</p>
    </div>

    <!-- Category Filter Bar -->
    <div class="projects-filter-bar">
      <button class="filter-btn active" data-filter="all">All Experiments</button>
      <button class="filter-btn" data-filter="science">Physics & Science</button>
      <button class="filter-btn" data-filter="generative_art">Generative Art</button>
      <button class="filter-btn" data-filter="math">Mathematics</button>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid">
      {% for proj in site.data.projects %}
      <div class="project-card" data-category="{{ proj.category }}">
        <div class="project-gradient-header" style="background: {{ proj.gradient }};">
          <span class="project-tag">{{ proj.tag }}</span>
          <span class="project-tech">{{ proj.tech }}</span>
        </div>
        <div class="project-body">
          <h3>{{ proj.name }}</h3>
          <p>{{ proj.description }}</p>
          <div class="project-footer">
            <a href="{{ proj.repo_url }}" target="_blank" class="repo-link">
              View Source Code ↗
            </a>
            <span class="live-badge">Open Source</span>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
